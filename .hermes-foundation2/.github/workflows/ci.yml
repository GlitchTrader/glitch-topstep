name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/*.py plugins/topstep-control/__init__.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate SHA256SUMS
        run: python -c "from pathlib import Path; import sys; sys.path.insert(0,'scripts'); from distribution_manifest import verify_sha256sums; errors=verify_sha256sums(Path('.')); assert not errors, errors"
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('operator.json').read_text())
          print('operator.json valid')
          PY
