name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/validate-agent-paths.mjs
      - run: npm audit --omit=dev --audit-level=high
      - name: Run build and tests
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-${{ github.run_id }}
          path: check.log
          if-no-files-found: error
          retention-days: 7

  fault-matrix:
    # TS-REAUDIT-10: the fault-matrix gate previously only ran on the manual paired release
    # candidate workflow -- meaning a PR could merge to main having never proven the kill-point,
    # lifecycle, and auth-backoff fault proofs. Runs against the profile's current main so a
    # gateway change that breaks pairing surfaces here, not only at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GlitchTrader/glitch-topstep-hermes-profile
          path: profile
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run reaudit:fault-matrix
        env:
          GLITCH_HERMES_PROFILE_ROOT: profile
      - name: Upload fault-matrix proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fault-matrix-proof-${{ github.run_id }}
          path: release/reaudit-fault-matrix-proof.json
          if-no-files-found: ignore
          retention-days: 7
