name: source-export

on:
  push:
    branches:
      - agent/topstep-capital-preservation
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Package dependencies
        run: tar -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/node_modules.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: node-modules-${{ github.sha }}
          path: ${{ runner.temp }}/node_modules.tar.gz
          if-no-files-found: error
          retention-days: 1
