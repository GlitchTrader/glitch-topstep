name: apply-ts-rel-01

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architect/ts-rel-01-compat-meta
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sanitize one-shot Markdown template
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_ts_rel_01.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'Authenticated `/health` includes a nonsecret `compatibility` object'
          new = 'Authenticated /health includes a nonsecret compatibility object'
          if text.count(old) != 1:
              raise SystemExit(f'expected one raw Markdown fragment, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - run: node tools/apply_ts_rel_01.mjs
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit verified product change and remove one-shot machinery
        run: |
          rm -f tools/apply_ts_rel_01.mjs .github/workflows/locate-ts-rel-01.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat(release): expose gateway compatibility metadata"
          git push origin HEAD:architect/ts-rel-01-compat-meta
