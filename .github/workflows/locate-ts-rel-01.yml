name: apply-ts-rel-01

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architect/ts-rel-01-compat-meta
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sanitize one-shot Markdown template
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_ts_rel_01.mjs')
          text = path.read_text(encoding='utf-8')
          for old, new in {
              'Authenticated `/health` includes a nonsecret `compatibility` object': 'Authenticated /health includes a nonsecret compatibility object',
              'Per-packet `execution.supported_actions` remains': 'Per-packet execution.supported_actions remains',
              '- `gateway_name`': '- gateway_name',
              '- `gateway_version`': '- gateway_version',
              '- `health_schema`': '- health_schema',
              '- `intent_schemas`': '- intent_schemas',
              '- `decision_packet_schemas`': '- decision_packet_schemas',
              '- `capabilities`': '- capabilities',
          }.items():
              if old not in text:
                  raise SystemExit(f'missing generator template fragment: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - run: node tools/apply_ts_rel_01.mjs
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit verified product change and remove one-shot machinery
        run: |
          rm -f tools/apply_ts_rel_01.mjs .github/workflows/locate-ts-rel-01.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat(release): expose gateway compatibility metadata"
          git push origin HEAD:architect/ts-rel-01-compat-meta
