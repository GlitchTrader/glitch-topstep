name: apply-ts-rel-01

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architect/ts-rel-01-compat-meta
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node tools/apply_ts_rel_01.mjs
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit verified product change and remove one-shot machinery
        run: |
          rm -f tools/apply_ts_rel_01.mjs .github/workflows/locate-ts-rel-01.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat(release): expose gateway compatibility metadata"
          git push origin HEAD:architect/ts-rel-01-compat-meta
