<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glitch Topstep Console</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, monospace; }
    body { margin: 1rem; background: #0f1115; color: #e6edf3; }
    h1 { font-size: 1.1rem; font-weight: 600; }
    .meta { color: #8b949e; margin-bottom: 1rem; }
    button { margin-right: 0.5rem; padding: 0.4rem 0.8rem; cursor: pointer; }
    pre {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.75rem;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error { color: #f85149; }
  </style>
</head>
<body>
  <h1>Glitch Topstep — read-only console</h1>
  <p class="meta">Loopback dashboard. Token stays in memory only; nothing is persisted.</p>
  <button id="refresh">Refresh</button>
  <p id="status" class="meta">Waiting for token…</p>
  <h2>/health</h2>
  <pre id="health">—</pre>
  <h2>/state</h2>
  <pre id="state">—</pre>
  <script>
    const statusEl = document.getElementById("status");
    const healthEl = document.getElementById("health");
    const stateEl = document.getElementById("state");
    let token = null;

    function ensureToken() {
      if (token) return token;
      const entered = window.prompt("Bearer token for local gateway read APIs:");
      if (!entered || !entered.trim()) {
        throw new Error("token_required");
      }
      token = entered.trim();
      return token;
    }

    async function fetchJson(path) {
      const response = await fetch(path, {
        headers: { Authorization: "Bearer " + ensureToken() },
      });
      const text = await response.text();
      let body;
      try {
        body = JSON.parse(text);
      } catch {
        body = text;
      }
      if (!response.ok) {
        throw new Error(path + " " + response.status + ": " + text);
      }
      return body;
    }

    async function refresh() {
      statusEl.textContent = "Loading…";
      statusEl.className = "meta";
      try {
        const [health, state] = await Promise.all([
          fetchJson("/health"),
          fetchJson("/state"),
        ]);
        healthEl.textContent = JSON.stringify(health, null, 2);
        stateEl.textContent = JSON.stringify(state, null, 2);
        statusEl.textContent = "Updated " + new Date().toISOString();
      } catch (error) {
        statusEl.textContent = String(error.message || error);
        statusEl.className = "meta error";
      }
    }

    document.getElementById("refresh").addEventListener("click", () => {
      void refresh();
    });
    void refresh();
  </script>
</body>
</html>
